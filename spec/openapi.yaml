# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── PARAMETERS ────────────────────────────────────────────
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    SortParam:
      name: sort
      in: query
      schema:
        type: string
        example: createdAt,desc

  # ── RESPONSES ─────────────────────────────────────────────
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFoundError:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnauthorizedError:
      description: Authentication required or failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ForbiddenError:
      description: Access denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictError:
      description: Resource already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableError:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  # ── SCHEMAS ───────────────────────────────────────────────
  schemas:

    # ── Enums ────────────────────────────────────────────────
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED, RETURNED]

    PaymentMethod:
      type: string
      enum: [CREDIT_CARD, DEBIT_CARD, WALLET, GIFT_CARD, POINTS]

    PaymentStatus:
      type: string
      enum: [INITIATED, SUCCESS, FAILED, REFUNDED]

    ShipmentStatus:
      type: string
      enum: [CREATED, DISPATCHED, IN_TRANSIT, DELIVERED, CANCELLED, RETURNED]

    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED]

    # ── Problem Details (RFC 7807) ───────────────────────────
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    # ── API Envelope ─────────────────────────────────────────
    ApiMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string

    PageMeta:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            page:
              type: integer
            size:
              type: integer
            totalElements:
              type: integer
              format: int64
            totalPages:
              type: integer

    ApiResponseMessage:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    # ── Auth Schemas ─────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 100
        phone:
          type: string
          maxLength: 20

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/UserResponse'

    ApiResponseAuthResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    # ── User Schemas ─────────────────────────────────────────
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          maxLength: 20

    AddressRequest:
      type: object
      required: [line1, city, state, country, pincode]
      properties:
        label:
          type: string
          maxLength: 50
        line1:
          type: string
          minLength: 1
          maxLength: 255
        line2:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          minLength: 1
          maxLength: 100
        pincode:
          type: string
          minLength: 1
          maxLength: 20
        isDefault:
          type: boolean
          default: false

    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        isDefault:
          type: boolean

    ApiResponseUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    PagedApiResponseUserResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'
        errors:
          type: array
          items: {}

    ApiResponseAddressList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AddressResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    ApiResponseAddressResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AddressResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    # ── Category Schemas ─────────────────────────────────────
    CategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          default: 0

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        parentId:
          type: string
          format: uuid
        displayOrder:
          type: integer

    ApiResponseCategoryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CategoryResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    ApiResponseCategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    # ── Author Schemas ───────────────────────────────────────
    AuthorRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
        profileImageUrl:
          type: string
          format: uri

    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string
        profileImageUrl:
          type: string

    ApiResponseAuthorResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthorResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    PagedApiResponseAuthorResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuthorResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'
        errors:
          type: array
          items: {}

    # ── Publisher Schemas ────────────────────────────────────
    PublisherRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        country:
          type: string
          maxLength: 100
        websiteUrl:
          type: string
          format: uri

    PublisherResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country:
          type: string
        websiteUrl:
          type: string

    ApiResponsePublisherResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PublisherResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    PagedApiResponsePublisherResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublisherResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'
        errors:
          type: array
          items: {}

    # ── Book Schemas ─────────────────────────────────────────
    BookRequest:
      type: object
      required: [title, isbn, publisherId, price, stockQuantity, deliveryDays, authorIds, categoryIds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        isbn:
          type: string
          pattern: '^97[89]\d{10}$'
        publisherId:
          type: string
          format: uuid
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        stockQuantity:
          type: integer
          minimum: 0
        coverImageUrl:
          type: string
          format: uri
        language:
          type: string
          default: English
        pages:
          type: integer
          minimum: 1
        publishedDate:
          type: string
          format: date
        deliveryDays:
          type: integer
          minimum: 1
        authorIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1

    BookSummaryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isbn:
          type: string
        price:
          type: number
          format: double
        coverImageUrl:
          type: string
        averageRating:
          type: number
          format: double
        reviewCount:
          type: integer
        deliveryDays:
          type: integer
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorResponse'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'

    BookDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BookSummaryResponse'
        - type: object
          properties:
            description:
              type: string
            publisher:
              $ref: '#/components/schemas/PublisherResponse'
            language:
              type: string
            pages:
              type: integer
            publishedDate:
              type: string
              format: date
            stockQuantity:
              type: integer
            isActive:
              type: boolean

    ApiResponseBookDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BookDetailResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    PagedApiResponseBookSummaryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'
        errors:
          type: array
          items: {}

    ApiResponseBookSummaryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryResponse'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    # ── Wishlist Schemas ─────────────────────────────────────
    WishlistItemRequest:
      type: object

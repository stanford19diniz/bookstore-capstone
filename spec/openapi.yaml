          $ref: '#/components/schemas/ApiMeta'
        errors:
          type: array
          items: {}

    # ── Cart Schemas ─────────────────────────────────────────
    CartItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    UpdateQtyRequest:
      type: object

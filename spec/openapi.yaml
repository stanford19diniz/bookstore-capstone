          type: integer
          minimum: 1

    CartItemResponse:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        book:
          $ref: '#/components/schemas/BookSummaryResponse'
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        lineTotal:
          type: number
          format: double

    CartResponse:

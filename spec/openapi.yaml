openapi: 3.1.0
info:
  title: eCommerce Bookstore API
  description: |
    REST API for the eCommerce Bookstore platform.
    Covers authentication, catalog, cart, orders, payments, shipping, reviews and recommendations.
    Spec-driven development — this file is the single source of truth for all backend code generation.
  version: 1.0.0
  contact:
    name: Bookstore API Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.bookstore.example.com/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Users
  - name: Categories
  - name: Authors
  - name: Publishers
  - name: Books
  - name: Search
  - name: Wishlist
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Shipping
  - name: Reviews
  - name: Coupons
  - name: Recommendations

# ─────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────
paths:

  # ── AUTH ──────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new customer account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive JWT tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current user
      operationId: logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ── USERS ─────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List all users (Admin)
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponseUserResponse'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Users]
      summary: Update user profile
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Users]
      summary: Deactivate user (Admin)
      operationId: deactivateUser
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  /users/{id}/addresses:
    get:
      tags: [Users]
      summary: List addresses for a user
      operationId: listUserAddresses
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAddressList'
    post:
      tags: [Users]
      summary: Add address for a user
      operationId: addUserAddress
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAddressResponse'

  /users/{id}/addresses/{addressId}:
    put:
      tags: [Users]
      summary: Update an address
      operationId: updateUserAddress
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAddressResponse'
    delete:
      tags: [Users]
      summary: Delete an address
      operationId: deleteUserAddress
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  # ── CATEGORIES ────────────────────────────────────────────
  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      operationId: listCategories
      security: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryList'
    post:
      tags: [Categories]
      summary: Create category (Admin)
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      operationId: getCategoryById
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Categories]
      summary: Update category (Admin)
      operationId: updateCategory
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCategoryResponse'
    delete:
      tags: [Categories]
      summary: Delete category (Admin)
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  # ── AUTHORS ───────────────────────────────────────────────
  /authors:
    get:
      tags: [Authors]
      summary: List authors
      operationId: listAuthors
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated author list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponseAuthorResponse'
    post:
      tags: [Authors]
      summary: Create author (Admin)
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthorResponse'

  /authors/{id}:
    get:
      tags: [Authors]
      summary: Get author by ID
      operationId: getAuthorById
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Authors]
      summary: Update author (Admin)
      operationId: updateAuthor
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthorResponse'
    delete:
      tags: [Authors]
      summary: Delete author (Admin)
      operationId: deleteAuthor
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  # ── PUBLISHERS ────────────────────────────────────────────
  /publishers:
    get:
      tags: [Publishers]
      summary: List publishers
      operationId: listPublishers
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Paginated publisher list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponsePublisherResponse'
    post:
      tags: [Publishers]
      summary: Create publisher (Admin)
      operationId: createPublisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublisherRequest'
      responses:
        '201':
          description: Publisher created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublisherResponse'

  /publishers/{id}:
    get:
      tags: [Publishers]
      summary: Get publisher by ID
      operationId: getPublisherById
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Publisher found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublisherResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Publishers]
      summary: Update publisher (Admin)
      operationId: updatePublisher
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublisherRequest'
      responses:
        '200':
          description: Publisher updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePublisherResponse'
    delete:
      tags: [Publishers]
      summary: Delete publisher (Admin)
      operationId: deletePublisher
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  # ── BOOKS ─────────────────────────────────────────────────
  /books:
    get:
      tags: [Books]
      summary: List / filter books
      operationId: listBooks
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: publisherId
          in: query
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
            minimum: 0
        - name: language
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated book list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponseBookSummaryResponse'
    post:
      tags: [Books]
      summary: Create book (Admin)
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBookDetailResponse'
        '409':
          $ref: '#/components/responses/ConflictError'

  /books/{id}:
    get:
      tags: [Books]
      summary: Get book detail
      operationId: getBookById
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Book detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBookDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags: [Books]
      summary: Update book (Admin)
      operationId: updateBook
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBookDetailResponse'
    delete:
      tags: [Books]
      summary: Delete book (Admin)
      operationId: deleteBook
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  /books/{id}/related:
    get:
      tags: [Books]
      summary: Get related books
      operationId: getRelatedBooks
      security: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Related books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBookSummaryList'

  # ── SEARCH ────────────────────────────────────────────────
  /search/books:
    get:
      tags: [Search]
      summary: Full-text search books
      operationId: searchBooks
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
        - name: publisherId
          in: query
          schema:
            type: string
            format: uuid
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponseBookSummaryResponse'

  # ── WISHLIST ──────────────────────────────────────────────
  /wishlist:
    get:
      tags: [Wishlist]
      summary: Get my wishlist
      operationId: getMyWishlist
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWishlistResponse'
    delete:
      tags: [Wishlist]
      summary: Clear wishlist
      operationId: clearWishlist
      responses:
        '200':
          description: Cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  /wishlist/items:
    post:
      tags: [Wishlist]
      summary: Add book to wishlist
      operationId: addToWishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistItemRequest'
      responses:
        '200':
          description: Updated wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWishlistResponse'
        '409':
          $ref: '#/components/responses/ConflictError'

  /wishlist/items/{bookId}:
    delete:
      tags: [Wishlist]
      summary: Remove book from wishlist
      operationId: removeFromWishlist
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  # ── CART ──────────────────────────────────────────────────
  /cart:
    get:
      tags: [Cart]
      summary: Get my cart
      operationId: getMyCart
      responses:
        '200':
          description: Cart with totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
    delete:
      tags: [Cart]
      summary: Clear cart
      operationId: clearCart
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addToCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /cart/items/{bookId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItemQuantity
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQtyRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeFromCart
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'

  # ── ORDERS ────────────────────────────────────────────────
  /orders:
    get:
      tags: [Orders]
      summary: My order history
      operationId: listMyOrders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponseOrderSummaryResponse'
    post:
      tags: [Orders]
      summary: Place a new order
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /orders/admin:
    get:
      tags: [Orders]
      summary: List all orders (Admin)
      operationId: listAllOrders
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: All orders paginated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedApiResponseOrderSummaryResponse'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order detail
      operationId: getOrderById
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order (within 48hrs)
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /orders/{id}/return:
    post:
      tags: [Orders]
      summary: Initiate order return
      operationId: returnOrder
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnOrderRequest'
      responses:
        '200':
          description: Return initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderResponse'

  /orders/{id}/buy-again:
    post:
      tags: [Orders]
      summary: Buy Again — re-add order items to cart
      operationId: buyAgain
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Items added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCartResponse'

  # ── PAYMENTS ──────────────────────────────────────────────
  /payments:
    post:
      tags: [Payments]
      summary: Process payment for an order
      operationId: processPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentResponse'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /payments/{orderId}:
    get:
      tags: [Payments]
